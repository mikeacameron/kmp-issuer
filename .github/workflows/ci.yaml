name: ci

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:

permissions:
  contents: read

env:
  # ghcr.io/<owner>/<repo>, lowercased by the metadata action.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l ./api ./cmd ./internal ./test)"
        if [ -n "$unformatted" ]; then
          echo "these files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test $(go list ./... | grep -v /e2e) -race -coverprofile cover.out

    - name: Build
      run: go build ./...

  image:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Needed to push to the GitHub container registry.
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    # A pull request from a fork has no registry credentials, so those builds
    # only check that the image still builds.
    - name: Log in to the container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Derive the image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,format=long
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=kmp-issuer
          org.opencontainers.image.description=cert-manager external issuer for ManageEngine Key Manager Plus

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
