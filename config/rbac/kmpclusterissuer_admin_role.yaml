# This rule is not used by the project kmp-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kmp.cert-manager.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kmp-issuer
    app.kubernetes.io/managed-by: kustomize
  name: kmpclusterissuer-admin-role
rules:
- apiGroups:
  - kmp.cert-manager.io
  resources:
  - kmpclusterissuers
  verbs:
  - '*'
- apiGroups:
  - kmp.cert-manager.io
  resources:
  - kmpclusterissuers/status
  verbs:
  - get
