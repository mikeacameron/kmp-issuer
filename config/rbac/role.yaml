---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests/status
  verbs:
  - patch
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests/status
  verbs:
  - patch
- apiGroups:
  - certificates.k8s.io
  resourceNames:
  - kmpclusterissuers.kmp.cert-manager.io/*
  - kmpissuers.kmp.cert-manager.io/*
  resources:
  - signers
  verbs:
  - sign
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - kmp.cert-manager.io
  resources:
  - kmpclusterissuers
  - kmpissuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kmp.cert-manager.io
  resources:
  - kmpclusterissuers/status
  - kmpissuers/status
  verbs:
  - patch
