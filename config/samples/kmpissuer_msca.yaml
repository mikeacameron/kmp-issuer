# Signing with a Microsoft CA that Key Manager Plus reaches directly.
apiVersion: v1
kind: Secret
metadata:
  name: kmp-credentials
  namespace: app
type: Opaque
stringData:
  # Generated in Key Manager Plus under Personalize -> API.
  authtoken: "A3164150-4C15-4AA4-918E-F258F38149F8"
  # Optional: the CA that signed the Key Manager Plus server certificate.
  # ca.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
---
apiVersion: kmp.cert-manager.io/v1alpha1
kind: KMPIssuer
metadata:
  name: kmp
  namespace: app
spec:
  url: https://kmp.example.com:6565
  authTokenSecretRef:
    name: kmp-credentials
    key: authtoken
  caBundleSecretRef:
    name: kmp-credentials
    key: ca.crt
  signing:
    signType: MSCA
    serverName: ca1.corp.example.com
    caName: corp-issuing-ca
    templateName: WebServer
    email: pki@example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: app
spec:
  secretName: app-tls
  commonName: app.example.com
  dnsNames:
  - app.example.com
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: kmp
    kind: KMPIssuer
    group: kmp.cert-manager.io
