apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    app.kubernetes.io/name: kmp-issuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmp-issuer
  namespace: system
  labels:
    app.kubernetes.io/name: kmp-issuer
    control-plane: kmp-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kmp-issuer
      control-plane: kmp-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kmp-issuer
        control-plane: kmp-issuer
    spec:
      serviceAccountName: kmp-issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/mikeacameron/kmp-issuer:latest
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        env:
        # The controller reads Secrets referenced by a KMPClusterIssuer from
        # this namespace.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: probes
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 10
