name: ci

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: "1.24"
        cache: true

    # The repository ships go.mod without go.sum, so dependencies are resolved
    # here rather than being vendored.
    - name: Resolve dependencies
      run: go mod tidy

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l ./api ./cmd ./internal)"
        if [ -n "$unformatted" ]; then
          echo "these files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./... -race -coverprofile cover.out

    - name: Build
      run: go build ./...
