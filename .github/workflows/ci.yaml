name: ci

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l ./api ./cmd ./internal ./test)"
        if [ -n "$unformatted" ]; then
          echo "these files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test $(go list ./... | grep -v /e2e) -race -coverprofile cover.out

    - name: Build
      run: go build ./...
