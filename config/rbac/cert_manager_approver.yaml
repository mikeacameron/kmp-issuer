# cert-manager's built-in approver only approves CertificateRequests for
# signers it holds the "approve" permission on. Without this binding every
# request for a KMPIssuer stays unapproved and is never signed.
#
# The subject below matches a default cert-manager installation. Adjust the
# ServiceAccount name and namespace if cert-manager runs elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmp-issuer-approver-role
  labels:
    app.kubernetes.io/name: kmp-issuer
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - signers
  resourceNames:
  - kmpissuers.kmp.cert-manager.io/*
  - kmpclusterissuers.kmp.cert-manager.io/*
  verbs:
  - approve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmp-issuer-approver-rolebinding
  labels:
    app.kubernetes.io/name: kmp-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kmp-issuer-approver-role
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
